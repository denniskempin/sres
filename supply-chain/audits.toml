
# cargo-vet audits file

[criteria.ai-safe-to-run]
description = """
AI-assisted safe-to-run review (Hydrogen swarm + deterministic capability-sink gate).
Verifies that compiling or running the crate will not execute malicious behavior
(credential/env exfiltration, unexpected network/process execution, filesystem
tampering outside OUT_DIR, linker/constructor hooks, or hidden binary payloads).
"""

