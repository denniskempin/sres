[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; transitive via pulp/rav1e -> image 0.25" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; transitive via owned_ttf_parser -> ab_glyph -> sctk-adwaita -> winit" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6); transitive via accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (merged into zbus 6); transitive via accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (merged into zbus 6); transitive via accesskit_unix" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
