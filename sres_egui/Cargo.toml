[package]
name = "sres_egui"
version = "0.1.0"
authors = ["Dennis Kempin <dennis.kempin@gmail.com>"]
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links", "wayland", "wgpu", "x11"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
itertools = "0.15"
serde_json = "1.0"
sres_emulator = { version = "0.1.0", path = "../sres_emulator" }
strum = { version = "0.28", features = ["derive"] }
log = "0.4"
lazy_static = "1.5"
cpal = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4']
