name: Postsubmit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; keep in-progress `main` deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Every job runs inside the prebuilt CI container (`ghcr.io/denniskempin/sres-ci:latest`).
  health:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny if missing from CI image
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            DENY_VERSION=0.22.1
            triple="x86_64-unknown-linux-musl"
            deny_sha256="13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/cargo-deny.tar.gz \
              "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-${triple}.tar.gz"
            echo "${deny_sha256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
            tar -xzf /tmp/cargo-deny.tar.gz -C /usr/local/bin --strip-components=1 "cargo-deny-${DENY_VERSION}-${triple}/cargo-deny"
            rm /tmp/cargo-deny.tar.gz
          fi

      - name: Format, Clippy, and Deny
        run: ./check-all.sh fmt clippy deny

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests
        run: ./check-all.sh test

  wasm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache Trunk tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          restore-keys: trunk-tools-

      - name: WASM build
        run: ./check-all.sh wasm

  # Single required check for pull requests targeting main.
  # Keep this job id stable; `.github/rulesets/require-postsubmit.json` requires it.
  required:
    if: always()
    needs: [health, test, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.health.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.wasm.result }}" = "success"

  # Build and deploy to GitHub Pages (not a PR check; `./check-all.sh wasm` already built without --public-url)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: ./sres_egui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: wasm
          save-if: false
      - name: Restore Trunk tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile') }}
          restore-keys: trunk-tools-

      - name: Build
        run: NO_COLOR=true trunk build --locked --public-url=https://denniskempin.github.io/sres/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "sres_egui/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
