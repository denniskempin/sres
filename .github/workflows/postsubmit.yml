name: Postsubmit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; keep in-progress `main` deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Every job runs inside the prebuilt CI container (`ghcr.io/denniskempin/sres-ci:latest`).
  health:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format and Clippy
        run: ./check-all.sh fmt clippy

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests
        run: ./check-all.sh test

  wasm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache Trunk tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile.ci') }}
          restore-keys: trunk-tools-

      - name: WASM build
        run: ./check-all.sh wasm

  # Single required check for pull requests targeting main.
  # Keep this job id stable; `.github/rulesets/require-postsubmit.json` requires it.
  required:
    if: always()
    needs: [health, test, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.health.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.wasm.result }}" = "success"

  # Build and deploy to GitHub Pages (not a PR check; `./check-all.sh wasm` already built without --public-url)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/denniskempin/sres-ci:latest
      options: --user 0:0
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: ./sres_egui
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: false
      - name: Restore Trunk tools
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Cargo.lock', '.devcontainer/Dockerfile.ci') }}
          restore-keys: trunk-tools-

      - name: Build
        run: NO_COLOR=true trunk build --public-url=https://denniskempin.github.io/sres/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "sres_egui/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
