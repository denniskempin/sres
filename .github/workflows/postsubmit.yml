name: Postsubmit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; keep in-progress `main` deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Every job runs inside the flake dev shell, so tool versions come from `flake.lock`.
  # fmt + clippy. Commands: `nix develop -c ./check-all.sh fmt clippy`
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postsubmit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: nix develop -c {0}

      - name: Format and Clippy
        run: nix develop -c ./check-all.sh fmt clippy

  # Workspace tests (sres_emulator + sres_egui). Command: `nix develop .#ci -c ./check-all.sh test`
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postsubmit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: nix develop .#ci -c {0}

      - name: Tests
        run: nix develop .#ci -c ./check-all.sh test

  # Trunk WASM build. Command: `nix develop -c ./check-all.sh wasm`
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postsubmit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: nix develop -c {0}

      - name: WASM build
        run: nix develop -c ./check-all.sh wasm

  # Single required check for pull requests targeting main.
  # Keep this job id stable; `.github/rulesets/require-postsubmit.json` requires it.
  required:
    if: always()
    needs: [health, test, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.health.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.wasm.result }}" = "success"

  # Build and deploy to GitHub Pages (not a PR check; `./check-all.sh wasm` already built without --public-url)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: ./sres_egui
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: postsubmit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cmd-format: nix develop -c {0}

      - name: Build
        run: nix develop -c trunk build --public-url=https://denniskempin.github.io/sres/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "sres_egui/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
