name: Postsubmit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check formatting and clippy
  health:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown -p sres_egui

  # Run tests
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Run Tests
        run: cargo nextest run --verbose -p sres_emulator

  # Run tests with coverage
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Run Tests
        run: cargo llvm-cov nextest -p sres_emulator --codecov --output-path codecov.json

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  # Single required check for pull requests targeting main.
  # Keep this job id stable; `.github/rulesets/require-postsubmit.json` requires it.
  required:
    if: always()
    needs: [health, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.health.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"

  # Build and deploy to GitHub Pages
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: ./sres_egui
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@trunk

      - name: Build
        run: trunk build --public-url=https://denniskempin.github.io/sres/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "sres_egui/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
