name: Dev Container Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - ".github/workflows/dev-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arch:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.arch }} image
        run: |
          TAG="$(sha256sum .devcontainer/Dockerfile rust-toolchain.toml | sha256sum | cut -c1-12)"
          REPO="ghcr.io/denniskempin/sres-dev"
          docker pull "${REPO}:latest" || true
          docker build \
            --cache-from "${REPO}:latest" \
            -t "${REPO}:${TAG}-${{ matrix.arch }}" \
            -f .devcontainer/Dockerfile \
            .
          docker push "${REPO}:${TAG}-${{ matrix.arch }}"

  publish-manifest:
    needs: [build-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push multi-arch manifest
        run: |
          TAG="$(sha256sum .devcontainer/Dockerfile rust-toolchain.toml | sha256sum | cut -c1-12)"
          REPO="ghcr.io/denniskempin/sres-dev"
          docker buildx imagetools create \
            -t "${REPO}:${TAG}" \
            -t "${REPO}:latest" \
            "${REPO}:${TAG}-amd64" \
            "${REPO}:${TAG}-arm64"
